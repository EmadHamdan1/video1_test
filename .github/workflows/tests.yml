name: Python syntax and timing tests

on:
  push:
    branches: ["main", "feat/capcut-montage-pipeline"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run timing unit tests
        run: python -m unittest discover -s tests -v
  
  motion-lab-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check reusable motion compositions
        run: npm run typecheck
