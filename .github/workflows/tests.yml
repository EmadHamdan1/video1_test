name: Python syntax and timing tests

on:
  push:
    branches: ["main", "feat/capcut-montage-pipeline", "feat/universal-montage-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse Windows PowerShell launchers
        shell: pwsh
        run: |
          $files = @("run_nutty_putty.ps1", "run_unified_pipeline.ps1", "asset_tool.ps1", "check_tools.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell syntax check failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }


  hyperframes-alpha-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python image dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Render layered HyperFrames composition
        run: python scripts/render_hyperframes_demo.py
      - name: Verify transparent ProRes output and duration
        shell: bash
        run: |
          output="build/hyperframes-demo/hyperframes/overlay.mov"
          test -f "$output"
          metadata=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,duration -of json "$output")
          echo "$metadata"
          echo "$metadata" | grep -q '"codec_name": "prores"'
          echo "$metadata" | grep -Eq '"pix_fmt": "yuva'
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$output")
          python -c "import sys; d=float(sys.argv[1]); assert abs(d-6.0)<0.06, f'wrong overlay duration: {d}'" "$duration"

  motion-lab-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Remotion and GSAP dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check reusable motion compositions
        run: npm run typecheck
      - name: Install FFmpeg tools for alpha verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Ensure Remotion headless browser
        run: npx remotion browser ensure
      - name: Render transparent GSAP composition
        run: npm run render:casefile:alpha
      - name: Verify ProRes 4444 alpha output
        shell: bash
        run: |
          test -f out/casefile-overlay.mov
          stream=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=noprint_wrappers=1:nokey=1 out/casefile-overlay.mov)
          echo "$stream"
          echo "$stream" | grep -q "prores"
          echo "$stream" | grep -Eq "yuva444p(10|12)le"
